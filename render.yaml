services:
  - type: web
    name: mwiso
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.4"

      # --- Database -------------------------------------------------------
      # Anwani kamili ya Supabase. Nywila iliyokuwa kwenye settings.py
      # imeondolewa; ni LAZIMA ibadilishwe Supabase kwa sababu ipo kwenye
      # git history. `sync: false` inamaanisha thamani inawekwa kwa mkono
      # kwenye dashibodi, hairudi kwenye repo.
      - key: DATABASE_URL
        sync: false

      # --- Barua pepe (Gmail SMTP) ----------------------------------------
      # EMAIL_HOST_PASSWORD ni "App Password" ya Google, SI nenosiri la
      # akaunti. Iundwe kwenye myaccount.google.com > Security >
      # 2-Step Verification > App passwords.
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "MUWESTA <info@muslimwelfare.or.tz>"

      # --- SMS (NextSMS) --------------------------------------------------
      # NEXTSMS_TOKEN: dashibodi -> Customer Info -> Customization -> API Keys
      # NEXTSMS_SENDER: jina lililosajiliwa NextSMS. Lisilosajiliwa
      # linarudisha FAILED_SENDER bila SMS kutumwa.
      - key: NEXTSMS_TOKEN
        sync: false
      - key: NEXTSMS_SENDER
        sync: false
      # "True" hutumia njia ya majaribio: jibu la kweli, bila kutuma
      # wala kupunguza salio. Iwe "False" kwenye production.
      # Namba inayoonekana ndani ya ujumbe wa SMS ("wasiliana nasi").
      # Wakati wa ujenzi ni ya msanidi; ikikamilika, weka ya ofisi.
      - key: SUPPORT_PHONE
        value: "0629712678"
      # KWA MATENGENEZO PEKEE: ikiwekwa, SMS ZOTE zinaenda kwenye namba
      # hii badala ya za wahusika. IFUTE kabla ya kuachia wanachama.
      - key: SMS_REDIRECT_TO
        sync: false
      - key: NEXTSMS_TEST_MODE
        value: "False"
      # Kifungo cha dharura: "False" huzima code za kuingia.
      - key: LOGIN_OTP_ENABLED
        value: "True"

      # --- Selcom ---------------------------------------------------------
      # SELCOM_API_SECRET haiendi kwenye mtandao kamwe — inayoenda ni
      # saini ya HMAC-SHA256 pekee. Angalia finance/gateways/selcom.py.
      - key: SELCOM_VENDOR_ID
        sync: false
      - key: SELCOM_API_KEY
        sync: false
      - key: SELCOM_API_SECRET
        sync: false

      # --- Pesapal --------------------------------------------------------
      - key: SITE_URL
        value: "https://mwiso.onrender.com"
      - key: PESAPAL_ENV
        value: "live"
      - key: PESAPAL_CONSUMER_KEY
        sync: false
      - key: PESAPAL_CONSUMER_SECRET
        sync: false
      # Inapatikana kwa `python manage.py pesapal_ipn` baada ya deploy ya
      # kwanza. Bila hiyo, malipo ya mtandaoni hayataanza.
      - key: PESAPAL_IPN_ID
        sync: false
