{% load i18n mwst_tags %}
<section class="hero" style="min-height:0;padding:44px 26px;grid-template-columns:minmax(0,1fr)">
  <div class="reveal" style="max-width:700px">
    <span class="section__eyebrow" style="background:rgba(212,175,55,.16);color:var(--gold-400)">{{ hero.eyebrow|tr }}</span>
    <h1 style="font-size:36px;margin:14px 0 12px">{{ hero.title|tr }}</h1>
    <p>{{ hero.text|tr }}</p>
  </div>
</section>
